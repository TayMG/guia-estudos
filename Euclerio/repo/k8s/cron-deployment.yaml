apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron-deployment
  namespace: daemon-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cron
  template:
    metadata:
      labels:
        app: cron
    spec:
      containers:
      - name: cron
        image: cron-daemon:latest
        imagePullPolicy: Never